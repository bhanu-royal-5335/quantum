# =============================================================================
# Render Blueprint Specification (Infrastructure-as-Code)
# Project: Hierarchical Quantum Optical Communication Simulation & Verification
# =============================================================================

services:
  # -------------------------------------------------------------
  # Backend API Web Service (FastAPI / Python 3.11)
  # -------------------------------------------------------------
  - type: web
    name: quantum-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite SPA)
  # -------------------------------------------------------------
  - type: static
    name: quantum-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://quantum-backend.onrender.com
